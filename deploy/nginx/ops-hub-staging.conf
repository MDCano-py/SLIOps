# Operations Workflow Hub — staging reverse proxy
# Include inside your existing server { } for automation.streamlinescada.com
#
# Node app listens on 127.0.0.1:3010 with APP_BASE_PATH=/ops-hub-staging
# (see .env.staging.example). nginx forwards the same path prefix.

upstream ops_hub_staging {
    server 127.0.0.1:3010;
    keepalive 8;
}

location /ops-hub-staging/ {
    proxy_pass http://ops_hub_staging/ops-hub-staging/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection "";
    proxy_read_timeout 120s;
    proxy_send_timeout 120s;

    # Optional: restrict to office/VPN while testing (uncomment)
    # satisfy any;
    # allow 10.0.0.0/8;
    # deny all;
}

# Internal health (no path prefix) — for monitoring / deploy scripts
location = /ops-hub-staging-health {
    proxy_pass http://ops_hub_staging/health;
    access_log off;
    allow 127.0.0.1;
    deny all;
}
